name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build Electron packages (Linux)
        run: npx electron-builder --linux deb rpm AppImage --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Build Electron packages (Windows)
        run: npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: dist/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Build Electron packages (macOS)
        run: npx electron-builder --mac dmg --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: dist/*.dmg
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: List downloaded artifacts
        run: find dist-all -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ZTalk ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist-all/linux-builds/*.deb
            dist-all/linux-builds/*.rpm
            dist-all/linux-builds/*.AppImage
            dist-all/windows-builds/*.exe
            dist-all/macos-builds/*.dmg
          body: |
            ## ZTalk ${{ github.ref_name }}

            A zero-configuration peer-to-peer messaging, SSH management, and network tools application for local area networks. Built with Electron + React + Python (Flask).

            ### Features
            - P2P messaging with automatic peer discovery via mDNS
            - SSH connection management
            - Network tools and DHCP server
            - Encrypted local communication

            ### Downloads

            | Platform | File | Install |
            |----------|------|---------|
            | 🐧 Linux (Debian/Ubuntu) | `.deb` | `sudo dpkg -i ztalk_*.deb` |
            | 🐧 Linux (Fedora/RHEL) | `.rpm` | `sudo rpm -i ztalk_*.rpm` |
            | 🐧 Linux (Universal) | `.AppImage` | `chmod +x ztalk_*.AppImage && ./ztalk_*.AppImage` |
            | 🪟 Windows | `.exe` | Run the installer |
            | 🍎 macOS | `.dmg` | Open and drag to Applications |

            ### Requirements
            - Python 3.8+ must be installed on the host system
            - Local network access
            - No internet connection required — ZTalk works entirely on your LAN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
